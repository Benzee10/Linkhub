<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | LinkHub</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>
      :root { color-scheme: light; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --accent: #059669; }
      html.dark { color-scheme: dark; --bg: #020617; --card: #0f172a; --text: #f8fafc; --muted: #94a3b8; --border: #1e293b; --accent: #10b981; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 480px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 40px 28px; text-align: center; box-shadow: 0 20px 45px -15px rgba(15, 23, 42, 0.08); }
      .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(16, 185, 129, 0.12); color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 16px; }
      h1 { font-size: 32px; line-height: 1.15; font-weight: 800; margin-bottom: 12px; }
      p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a { text-decoration: none; font-weight: 700; font-size: 14px; padding: 13px 22px; border-radius: 14px; transition: opacity 0.2s; }
      a:hover { opacity: 0.9; }
      .primary { background: #10b981; color: #022c22; }
      .secondary { border: 1px solid var(--border); color: var(--text); }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Error 404</span>
      <h1>Page Not Found</h1>
      <p>The group directory or guide you requested may have moved or no longer exists.</p>
      <div class="actions">
        <a class="primary" href="/">Explore Directory</a>
        <a class="secondary" href="/blog">Read Guides</a>
      </div>
    </main>
  </body>
</html>
